version: '3.8'

services:
  db:
    build: 
      context: ./pocketbase_0.40.4_linux_amd64
      dockerfile: Dockerfile
    container_name: db-tacho
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
    restart: unless-stopped

  servidor-python:
    build: 
      context: ./servidor
      dockerfile: Dockerfile
    container_name: miniservidor-tacho
    ports:
      - "5000:5000"
    env_file:
      - ./servidor/.env.sh
    restart: unless-stopped
    depends_on:
      - db